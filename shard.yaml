shard-spec: "0.2.0"
version: "0.1.0"
name: Strike
shorthand: strk
description: Context and workflows for Strike, the local-first target-graph terminal app that launches Orbh sessions

dependencies:
  - source: NUU-Cognition/shard-flint
  - source: NUU-Cognition/shard-orbh
  - source: NUU-Cognition/shard-projects
    version: "1.3.1"

# The strike_start workflow delegates to the Projects shard's scope_task
# workflow, so Projects is a hard dependency. The floor is 1.3.1 because
# scope_task ships in the 1.3 line; the published repository carries 1.3.1 on
# its default branch, and its newest tag is v1.2.0.
#
# Strike owns no Mesh artifact type and no artifact folder. A Strike-launched
# session produces (Task) artifacts, which the Projects shard owns.
